[project]
name = "lia-api"
version = "0.1.0"
description = "Chat API for Lia, the Empório da Música virtual assistant"
authors = [
    { name = "Otniel Gomes", email = "otniel.g.andrade@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "langchain>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.7.3",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-postgres>=3.2.0",
    "langsmith>=0.3",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.7",
    "pydantic-settings>=2.16.2",
]

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.fastapi]
entrypoint = "lia_api.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

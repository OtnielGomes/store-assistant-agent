services:
  db:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lia}
      POSTGRES_DB: ${POSTGRES_DB:-lia}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:54330:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lia} -d ${POSTGRES_DB:-lia}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  ingest:
    build:
      context: ./api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lia}:${POSTGRES_PASSWORD:-lia}@db:5432/${POSTGRES_DB:-lia}
      DATA_DIR: /data
    volumes:
      - ./data:/data:ro
    command: ["python", "-m", "lia_api.ingest"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lia}:${POSTGRES_PASSWORD:-lia}@db:5432/${POSTGRES_DB:-lia}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 8
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8000}
    environment:
      APP_ENV: ${APP_ENV:-development}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
